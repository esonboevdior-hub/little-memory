<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Memory</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:#fbe8f3;color:#7b3157;
  font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;
}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.card{text-align:center;max-width:760px;width:100%}
.cat{font-size:82px;line-height:1;margin-bottom:14px;animation:bounce 2s infinite}
h1{font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:-2px}
p{font-size:18px;color:#9c5878;margin:14px 0 28px}
.buttons{display:flex;justify-content:center;align-items:center;gap:30px;min-height:120px}
button{
 border:0;border-radius:20px;padding:20px 52px;font-size:28px;font-weight:900;
 cursor:pointer;transition:.2s;box-shadow:0 10px 22px #c96f9833
}
.yes{background:#6bd89a;color:white}.no{background:#dc4d76;color:white;font-size:17px;padding:13px 25px}
.yes:hover{transform:scale(1.06)}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;font-size:20px;animation:fall 5s linear forwards;opacity:.7}
.page{display:none;min-height:100vh;padding:55px 20px}
.page.active{display:block}
.container{max-width:950px;margin:auto;text-align:center}
.back{background:#ec4f9a;color:#fff;font-size:17px;padding:13px 32px;border-radius:13px;margin-top:28px}
.gallery{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:24px;margin:35px 0
}
.photo{
 background:#fff;padding:12px 12px 35px;box-shadow:0 12px 30px #9c527533;
 transform:rotate(var(--r));transition:.25s
}
.photo:hover{transform:rotate(0) translateY(-8px) scale(1.03)}
.photo .pic{
 height:150px;border-radius:2px;
 background:linear-gradient(#bfe5f7 0 58%,#b9e07a 58% 100%);
 position:relative;overflow:hidden
}
.photo .pic:before{content:"☁";position:absolute;top:18px;left:35%;font-size:30px;color:white}
.photo .pic:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:45%;
 background:#79bd43;clip-path:polygon(0 55%,28% 20%,52% 50%,76% 12%,100% 48%,100% 100%,0 100%)}
.caption{font-family:Georgia,serif;font-style:italic;margin-top:13px;font-size:14px}
h2{font:italic 900 clamp(32px,7vw,54px) Georgia,serif;margin-bottom:8px}
.sub{font-family:Georgia,serif;font-style:italic}
#secret{display:none;margin-top:25px;font-size:20px;color:#b33768}
.qr{
 margin:30px auto 10px;width:min(290px,80vw);aspect-ratio:1;background:white;
 display:grid;place-items:center;border-radius:12px;box-shadow:0 12px 30px #9c527533
}
.qrtext{font-weight:900;font-size:25px;color:#c52e68;padding:20px}
@keyframes bounce{50%{transform:translateY(-8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
@media(max-width:500px){.buttons{gap:15px}.yes{padding:17px 40px}.no{padding:10px 20px}}
</style>
</head>
<body>

<div class="float" id="float"></div>

<section class="screen" id="home">
 <div class="card">
   <div class="cat">😽</div>
   <h1>nah that's not right...</h1>
   <p>Be honest with me 💗</p>
   <div class="buttons">
     <button class="yes" onclick="yes()">YES</button>
     <button class="no" id="noBtn" onclick="moveNo()">NO</button>
   </div>
   <div id="secret">I knew it! 🥹💗</div>
 </div>
</section>

<section class="page" id="memories">
 <div class="container">
   <h2>Captured memories</h2>
   <div class="sub">memories with you &nbsp; • &nbsp; us, in frames</div>
   <div class="gallery">
     <div class="photo" style="--r:-3deg"><div class="pic"></div><div class="caption">our little moment</div></div>
     <div class="photo" style="--r:2deg"><div class="pic"></div><div class="caption">just us</div></div>
     <div class="photo" style="--r:-2deg"><div class="pic"></div><div class="caption">a sweet memory</div></div>
     <div class="photo" style="--r:4deg"><div class="pic"></div><div class="caption">always remember</div></div>
     <div class="photo" style="--r:-4deg"><div class="pic"></div><div class="caption">one more smile</div></div>
   </div>
   <button class="back" onclick="back()">Go back</button>
 </div>
</section>

<section class="page" id="qr">
 <div class="container">
   <div class="cat">🥹</div>
   <h2>A little surprise</h2>
   <p>Scan this heart to open our special message.</p>
   <div class="qr"><div class="qrtext">♥<br>SCAN ME</div></div>
   <button class="back" onclick="back()">Go back</button>
 </div>
</section>

<script>
function yes(){
  document.getElementById('secret').style.display='block';
  for(let i=0;i<18;i++) setTimeout(()=>heart(),i*80);
  setTimeout(()=>show('memories'),900);
}
function moveNo(){
  const b=document.getElementById('noBtn');
  const x=Math.random()*Math.min(260,window.innerWidth-100);
  const y=Math.random()*220-110;
  b.style.transform=`translate(${x}px,${y}px)`;
}
function heart(){
 const h=document.createElement('span');h.className='heart';h.textContent=['♥','♡','💗','✦'][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+'%';h.style.top='-30px';h.style.animationDuration=(3+Math.random()*3)+'s';
 document.getElementById('float').appendChild(h);setTimeout(()=>h.remove(),6500);
}
function show(id){
 document.querySelectorAll('.screen,.page').forEach(x=>x.style.display='none');
 document.getElementById(id).style.display=id==='home'?'flex':'block';
 window.scrollTo(0,0);
}
function back(){show('home')}
</script>
</body>
</html>
